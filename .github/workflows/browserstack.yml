name: BrowserStack
on:
  workflow_dispatch:

jobs:
  test-browserstack:
    name: Test Browserstack
    runs-on: ubuntu-latest
    concurrency: browserstack
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Download BrowserStack Local binary
        run: |
          curl -fsSL -o "$RUNNER_TEMP/BrowserStackLocal.zip" https://www.browserstack.com/browserstack-local/BrowserStackLocal-linux-x64.zip
          unzip -o "$RUNNER_TEMP/BrowserStackLocal.zip" -d "$RUNNER_TEMP/browserstack-local"
          chmod +x "$RUNNER_TEMP/browserstack-local/BrowserStackLocal"
          echo "BROWSERSTACK_LOCAL_BINARY_PATH=$RUNNER_TEMP/browserstack-local/BrowserStackLocal" >> "$GITHUB_ENV"

      - name: Run tests
        run: pnpm test:browserstack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
