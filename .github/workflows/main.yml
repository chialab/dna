name: Main
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    uses: ./.github/workflows/lint_build_test.yml
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint-build-test
    permissions:
      id-token: write # Required for OIDC
      contents: write # Required to create the release
      pull-requests: write # Required to create the release PR
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Run build script
        run: pnpm build

      - name: Lint package
        run: pnpm publint --pack npm

      - name: Update NPM to latest version
        run: npm install -g npm@latest

      - name: DEBUG environment comparison
        run: |
          echo "--- pnpm config list ---"
          pnpm config list
          echo "--- npm config list ---"
          npm config list
          echo "--- env proxy vars ---"
          env | grep -i -E "proxy|npm_config|no_proxy" || true
          echo "--- raw curl registry response (first 300 chars) ---"
          curl -s https://registry.npmjs.org/@chialab%2Fdna | head -c 300
          echo
          echo "--- pnpm info with explicit --registry ---"
          pnpm info @chialab/dna --json --registry https://registry.npmjs.org/ | head -c 200
          echo
          echo "--- pnpm info via node fetch directly (bypass pnpm CLI parsing) ---"
          node -e "fetch('https://registry.npmjs.org/@chialab%2Fdna').then(r=>r.text()).then(t=>console.log(t.slice(0,300)))"
          echo "--- whoami / pwd / node version ---"
          whoami; pwd; node --version; pnpm --version

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
