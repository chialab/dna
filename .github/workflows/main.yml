name: Main
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    uses: ./.github/workflows/lint_build_test.yml
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint-build-test
    permissions:
      id-token: write # Required for OIDC
      contents: write # Required to create the release
      pull-requests: write # Required to create the release PR
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Run build script
        run: pnpm build

      - name: Lint package
        run: pnpm publint --pack npm

      - name: Update NPM to latest version
        run: npm install -g npm@latest

      - name: DEBUG store cache theory
        run: |
          echo "--- current pnpm store path ---"
          pnpm store path
          echo "--- pnpm info BEFORE clearing store (first 60 chars) ---"
          pnpm info @chialab/dna --json | head -c 60
          echo
          echo "--- pnpm store prune ---"
          pnpm store prune
          echo "--- pnpm info AFTER store prune (first 60 chars) ---"
          pnpm info @chialab/dna --json | head -c 60
          echo
          echo "--- pnpm info with a totally fresh store-dir (first 60 chars) ---"
          pnpm info @chialab/dna --json --store-dir /tmp/fresh-pnpm-store-$RANDOM | head -c 60
          echo
          echo "--- ls of default store dir metadata (if any) ---"
          find "$(pnpm store path)/../.." -maxdepth 4 -iname "*chialab*" 2>/dev/null || true

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
